plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = "com.swordfish.libretrodroid"
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        minSdk 21

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
        ndk {
            // armeabi-v7a is here for 32-bit Android TV boxes — the Chromecast with
            // Google TV (HD) reports only 'armeabi-v7a,armeabi', so a 64-bit-only build
            // has no library to dlopen and every launch dies inside GLRetroView.onCreate.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
}
